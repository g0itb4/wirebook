[workspace]
resolver = "3"
members = ["crates/core", "crates/core-wasm"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
