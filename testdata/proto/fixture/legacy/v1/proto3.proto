// proto3 fixture: scalars of every type, well-known types, recursion,
// deprecation.
syntax = "proto3";

package fixture.legacy.v1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// One field of every scalar type.
message Scalars {
  double double_value = 1;
  float float_value = 2;
  int32 int32_value = 3;
  int64 int64_value = 4;
  uint32 uint32_value = 5;
  uint64 uint64_value = 6;
  sint32 sint32_value = 7;
  sint64 sint64_value = 8;
  fixed32 fixed32_value = 9;
  fixed64 fixed64_value = 10;
  sfixed32 sfixed32_value = 11;
  sfixed64 sfixed64_value = 12;
  bool bool_value = 13;
  string string_value = 14;
  bytes bytes_value = 15;
  // Explicit presence in proto3.
  optional int32 optional_value = 16;
  map<bool, string> by_flag = 17;
  map<uint32, double> by_number = 18;
}

// One field of every well-known type.
message WellKnown {
  google.protobuf.Timestamp timestamp = 1;
  google.protobuf.Duration duration = 2;
  google.protobuf.FieldMask field_mask = 3;
  google.protobuf.Struct struct_value = 4;
  google.protobuf.Value value = 5;
  google.protobuf.ListValue list_value = 6;
  google.protobuf.Empty empty = 7;
  google.protobuf.Any any = 8;
  google.protobuf.DoubleValue double_wrapper = 9;
  google.protobuf.FloatValue float_wrapper = 10;
  google.protobuf.Int32Value int32_wrapper = 11;
  google.protobuf.UInt32Value uint32_wrapper = 12;
  google.protobuf.Int64Value int64_wrapper = 13;
  google.protobuf.UInt64Value uint64_wrapper = 14;
  google.protobuf.BoolValue bool_wrapper = 15;
  google.protobuf.StringValue string_wrapper = 16;
  google.protobuf.BytesValue bytes_wrapper = 17;
}

// A message that contains itself.
message Tree {
  string label = 1;
  repeated Tree children = 2;
  Tree parent = 3;
}

// How urgent a thing is.
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  // Use PRIORITY_LOW.
  PRIORITY_TRIVIAL = 2 [deprecated = true];
}

// Replaced by Tree.
message OldThing {
  option deprecated = true;

  // Replaced by Tree.label.
  string title = 1 [deprecated = true];
  Priority priority = 2;
}

message PingRequest {
  string text = 1;
}

message PingResponse {
  string text = 1;
}

// Replaced by fixture.v1.WidgetService.
service OldService {
  option deprecated = true;

  // Replaced by fixture.v1.WidgetService.GetWidget.
  rpc Ping(PingRequest) returns (PingResponse) {
    option deprecated = true;
  }
}
